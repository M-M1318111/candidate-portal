<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exam Staff & Center In-Charge Portal Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 font-sans text-slate-100">

    <div class="max-w-md w-full bg-slate-800/90 backdrop-blur-md p-8 rounded-3xl border border-slate-700 shadow-2xl">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-600/20 text-blue-400 border border-blue-500/30 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl">
                🛡️
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Staff & In-Charge Portal</h1>
            <p class="text-xs text-slate-400 mt-1">Authorized Center Staff & Invigilator Access Only</p>
        </div>

        {% if error_msg %}
        <div class="mb-5 p-3.5 bg-rose-500/10 border border-rose-500/30 rounded-xl text-rose-400 text-xs flex items-center gap-2">
            <span>⚠️</span> {{ error_msg }}
        </div>
        {% endif %}

        <!-- Login Form -->
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Staff Username / ID</label>
                <input type="text" name="username" required autofocus placeholder="Enter official username"
                    class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Access Password</label>
                <input type="password" name="password" required placeholder="••••••••••••"
                    class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
            </div>

            <button type="submit" 
                class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl text-sm transition duration-200 shadow-lg shadow-blue-600/30">
                Authenticate & Access Dashboard →
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-700/60 text-center">
            <a href="{% url 'home' %}" class="text-xs text-slate-400 hover:text-white transition">
                ← Back to Candidate Public Portal
            </a>
        </div>
    </div>

</body>
</html>
